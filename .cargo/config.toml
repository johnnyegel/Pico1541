# Linker flags and env for ARM no-std targets.
# These are only applied when building for that target, so they're safe
# to define at the workspace level alongside non-embedded crates.
[target.'cfg(all(target_arch = "arm", target_os = "none"))']
rustflags = [
  # "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-Map=target/output.map",
  "-C", "panic=abort"
]

[env]
DEFMT_LOG = "debug"
EMBASSY_EXECUTOR_TASK_ARENA_SIZE = "1024"

[alias]
# Flash via SWD and stream defmt/RTT logs with probe-rs.
# Usage: cargo flash-rtt
flash-swd = [
    "run",
    "--package", "pico1541-rp2350",
    "--target", "thumbv8m.main-none-eabihf",
    "--config", "target.'cfg(all(target_arch = \"arm\", target_os = \"none\"))'.runner = \"probe-rs run --chip RP235x --speed 10000\"",
]

# Flash via USB (Pico must be in BOOTSEL mode: hold BOOTSEL while plugging in).
# Usage: cargo flash-usb
flash-usb = [
    "run",
    "--package", "pico1541-rp2350",
    "--target", "thumbv8m.main-none-eabihf",
    "--config", "target.'cfg(all(target_arch = \"arm\", target_os = \"none\"))'.runner = \"picotool load -f -x\"",
]

attach-swd = [
    "run",
    "--package", "pico1541-rp2350",
    "--target", "thumbv8m.main-none-eabihf",
    "--config", "target.'cfg(all(target_arch = \"arm\", target_os = \"none\"))'.runner = \"probe-rs attach --chip RP235x --speed 10000\"",
]
test-swd = [
    "test",
    "--package", "pico1541-rp2350",
    "--bin", "test_pio",
    "--target", "thumbv8m.main-none-eabihf",
    "--config", "target.'cfg(all(target_arch = \"arm\", target_os = \"none\"))'.runner = \"probe-rs run --chip RP235x --speed 10000\""
]
