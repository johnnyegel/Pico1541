[package]
name = "pico1541-rp2040"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# Internal crates
pico1541-emulator = { path = "../pico1541-emulator" }
pico1541-manager = { path = "../pico1541-manager", features = ["defmt"] }
pico1541-common = { path = "../pico1541-common", features = ["defmt"] }

#[profile.release]
#opt-level = 3
#lto = true
#codegen-units = 1
#panic = "abort"

# Embassy
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp2040", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0" } # Matching a compatible version
embassy-futures = { version = "0.1.0" }

# Hardware & Runtime
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
defmt = "1.1.0"
defmt-rtt = "1.2.0"
static_cell = "2.1.0"
portable-atomic = { version = "1.5", features = ["critical-section"] }
critical-section = "1.2.0"
rp-pac = "7.0.0"
rp2040-boot2 = "0.3.0"
heapless = "0.9.3"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"
embedded-io-async = "0.7.0"
embedded-sdmmc = "0.9.0"
hadris-io = { version = "1", default-features = false, features = ["async", "alloc"] }
hadris-fat = { version = "1", default-features = false, features = ["async", "read", "lfn", "alloc"] }
embedded-timers = "0.4"
embedded-alloc = { version = "0.7.0", features = ["llff"] }

# Graphics & Display
embedded-graphics = "0.8.1"
ssd1306 = "0.10.0"
display-interface-i2c = "0.5.0"
display-interface = "0.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
