[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Use elf2uf2-rs for USB deployment (Pico in BOOTSEL mode)
runner = "elf2uf2-rs -d"
rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "debug"
EMBASSY_EXECUTOR_TASK_ARENA_SIZE = "32768"
