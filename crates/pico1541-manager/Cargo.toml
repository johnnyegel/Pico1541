[package]
name = "pico1541-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
pico1541-common = { path = "../pico1541-common" }
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1" }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embedded-io-async = "0.7.0"
heapless = "0.9.2"
log = "0.4.29"
critical-section = "1.2.0"
defmt = { version = "1.1.0", optional = true }

[features]
default = []
defmt = ["dep:defmt", "pico1541-common/defmt"]

[dev-dependencies]
futures-executor = "0.3.32"
