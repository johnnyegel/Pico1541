[package]
name = "pico1541-emulator"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mos6502 = { path = "../mos6502" }
log = "0.4.20"
embedded-io-async = "0.7.0"
pico1541-common = { path = "../pico1541-common" }

[features]
debug = []
logging = []

[dev-dependencies]
env_logger = "0.11.10"
pico1541-emulator = { path = ".", features = ["debug"] }
racc6502v2 = { path = "../racc6502v2", features = ["debug"] }
pico1541-common = { path = "../pico1541-common" }
futures = "0.3"
pollster = "0.4.0"
