[package]
name = "pico1541-emulator"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
racc6502 = { path = "../racc6502" }
log = "0.4.20"

[features]
debug = ["racc6502/debug"]

[dev-dependencies]
env_logger = "0.11.10"
pico1541-emulator = { path = ".", features = ["debug"] }
racc6502 = { path = "../racc6502", features = ["debug"] }
