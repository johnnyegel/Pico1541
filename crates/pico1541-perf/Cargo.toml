[package]
name = "pico1541-perf"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
test = false

[dependencies]
racc6502 = { path = "../racc6502" }
racc6502v2 = { path = "../racc6502v2" }
racc6502v3 = { path = "../racc6502v3" }
racc6502v4 = { path = "../racc6502v4" }
mos6502 = { path = "../mos6502" }

pico1541-emulator = { path = "../pico1541-emulator" }
pico1541-common = { path = "../pico1541-common" }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
defmt = "1.1.0"
defmt-test = "0.3.0"
defmt-rtt = "1.2.0"
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp2040", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-alloc = "0.5.1"

[[test]]
name = "perf_6502"
harness = false

[[test]]
name = "perf_via"
harness = false

[[test]]
name = "perf_mechanics"
harness = false

[[test]]
name = "perf_fastloader"
harness = false
