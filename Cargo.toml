[workspace]
members = [
    "crates/pico1541-common",
    "crates/racc6502",
    "crates/racc6502v2",
    "crates/pico1541-manager",
    "crates/pico1541-emulator",
    "crates/pico1541-rp2040",
    "crates/mos6502"
, "crates/racc6502v3"]
resolver = "2"

default-members = [
    "crates/racc6502",
    "crates/pico1541-manager",
    "crates/pico1541-common",
    "crates/pico1541-emulator",
    "crates/mos6502"
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 3
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
