[workspace]
members = [
    "crates/racc6502",
    "crates/racc6502v2",
    "crates/racc6502v3",
    "crates/racc6502v4",
    "crates/pico1541-common",
    "crates/pico1541-manager",
    "crates/pico1541-emulator",
    "crates/pico1541-rp2350",
    "crates/pico1541-rp-common",
    "crates/pico1541-perf",
    "tools/nbz2nib",
]

resolver = "2"

default-members = [
    "crates/racc6502v4",
    "crates/pico1541-manager",
    "crates/pico1541-common",
    "crates/pico1541-emulator"
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 2

[profile.dev]
opt-level = 3
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
debug = 2

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
